name: Feature request
description: Suggest an addition or change to Mira
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Related requirement, if any
      description: e.g. FR5, NFR2 — see CLAUDE.md for the full list.
    validations:
      required: false
  - type: dropdown
    id: safety
    attributes:
      label: Does this touch safety-critical code or copy (triage rules, crisis pathway, helpline config, user-facing safety copy)?
      options:
        - 'No'
        - 'Yes'
        - 'Not sure'
    validations:
      required: true
